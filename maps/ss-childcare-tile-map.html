<style>
@import url("https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap");

#map-tile-root,
#map-tile-root * {
  box-sizing: border-box;
  font-family: "Inter", Arial, Helvetica, sans-serif !important;
}

.sr-only {
  position: absolute !important;
  width: 1px !important;
  height: 1px !important;
  padding: 0 !important;
  margin: -1px !important;
  overflow: hidden !important;

  gap: 18px;

.mtm-ctrl select {
  font-size: 13px;
  font-weight: 600;
  line-height: 1.2;
  padding: 8px 34px 8px 10px;
  border-radius: 8px;
  border: 1px solid var(--color-border-secondary, #d6d6d6);
  background-color: var(--color-background-primary, #fff);
  color: var(--color-text-primary, #222);
  min-width: 170px;
}

.mtm-segmented {
  display: inline-flex;
  align-items: stretch;
  border: 1px solid var(--color-border-secondary, #d6d6d6);
  border-radius: 9px;
  overflow: hidden;
  background: var(--color-background-primary, #fff);
}

.mtm-xbtn {
  appearance: none;
  border: 0;
  border-right: 1px solid var(--color-border-secondary, #d6d6d6);
  background: var(--color-background-primary, #fff);
  color: var(--color-text-primary, #222);
  padding: 9px 13px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1;
  cursor: pointer;
  transition: background .12s, color .12s;
  border-radius: 0;
}

.mtm-xbtn:last-child {
  border-right: 0;
}

.mtm-xbtn:hover {
  background: var(--color-background-secondary, #f5f5f5);
}

.mtm-xbtn.is-active {
  background: #172b5f;
  color: #fff;
}

.mtm-legend {
  display: flex;
  align-items: center;
  justify-content: flex-start;
  gap: 8px;
  margin-top: 4px;

  color: var(--color-text-secondary, #666);
  flex-wrap: wrap;
}

.mtm-legend-bar {
  display: flex;
  border-radius: 5px;
  overflow: hidden;
  border: 1px solid rgba(0,0,0,.08);
}

.mtm-chart-scroll {
  overflow-x: auto;
  width: 100%;
}

#mtm-wrap {
  position: relative;
  margin: 0 auto;
}

#mtm-map {
  position: relative;
}

#mtm-tip {
  position: absolute;
  background: var(--color-background-primary, #fff);
  border: 1px solid var(--color-border-secondary, #ddd);
  border-radius: 12px;
  padding: 12px;
  font-size: 11px;
  line-height: 1.35;
  pointer-events: none;
  display: none;
  z-index: 20;
  color: var(--color-text-primary, #222);
  box-shadow: 0 14px 34px rgba(0,0,0,.18);

}

.mtm-tip-title {
  font-weight: 800;

  margin-bottom: 8px;
}

.mtm-mini-table-wrap {
  overflow-x: auto;
  max-width: 590px;
}

.mtm-mini-table {
  border-collapse: collapse;

}

.mtm-mini-table th,
.mtm-mini-table td {

  padding: 6px 7px;

}

.mtm-mini-table th {
  background: var(--color-background-secondary, #f5f5f5);
  font-weight: 800;
  text-align: center;
}

.mtm-mini-table th:first-child {
  text-align: left;
}

.mtm-mini-rowhead {
  font-weight: 800;
  background: var(--color-background-secondary, #f7f7f7);
}

.mtm-mini-cell {
  min-width: 92px;
}

.mtm-mini-value {
  font-weight: 800;
  font-size: 11px;
  margin-bottom: 4px;
}

.mtm-mini-bar {
  width: 74px;
  height: 7px;
  border-radius: 999px;
  background: rgba(0,0,0,.08);
  overflow: hidden;
}

.mtm-mini-fill {
  height: 100%;
  width: 0%;
  border-radius: 999px;
}

.mtm-mini-muted {
  color: var(--color-text-secondary, #777);
  font-weight: 600;
}
</style>

<div id="map-tile-root">
  <h2 class="sr-only">US state tile map colored by SS value, filterable by xtype and racecomp</h2>

  <div class="mtm-top">
    <div class="mtm-controls">
      <div>
        <div class="mtm-button-group-label">Family type</div>
        <div id="mtm-xtype-buttons" class="mtm-segmented"></div>
      </div>

      <div class="mtm-ctrl">
        <label for="mtm-race">Race/ethnicity</label>
        <select id="mtm-race"></select>
      </div>
    </div>

    <div class="mtm-legend">
      <span id="mtm-leg-min"></span>
      <div class="mtm-legend-bar" id="mtm-leg-bar"></div>
      <span id="mtm-leg-max"></span>
    </div>
  </div>

  <div class="mtm-chart-scroll">
    <div id="mtm-wrap">
      <div id="mtm-map"></div>
      <div id="mtm-tip"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
(function () {
  const CSV_URL = "https://raw.githubusercontent.com/glencorahaskins/applied-projects/refs/heads/main/maps/ss-childcare-tile-map.csv";
  const TILE_JSON_URL = "https://raw.githubusercontent.com/glencorahaskins/applied-projects/refs/heads/main/maps/us-states-square_dc.json";

  const TILE_SIZE = 58;
  const TILE_GAP = 7;
  const NO_DATA_COLOR = "#C8C5BC";

  const PALETTE = [
  "#C9550A",
  "#D05D0B",
  "#D7650E",
  "#DE6E14",
  "#E5771D",
  "#EB842B",
  "#F0923B",
  "#F4A14E",
  "#F7B164",
  "#F9C27D",
  "#F9D19A",
  "#F7DEB7",
  "#EFE8CF",
  "#DDEBF0",
  "#CBE1EC",
  "#B8D6E7",
  "#A4CAE0",
  "#8FBBD8",
  "#79ACCF",
  "#639BC5",
  "#4D89BA",
  "#3977AD",
  "#2B629B",
  "#224987",
  "#172B6A"
];

  let allData = [];
  let states = [];
  let tiles = {};
  let latestYear = null;
  let latestYearIsNumeric = true;
  let selectedXtype = "";
  let fixedBreaks = [];
  let fixedMin = null;
  let fixedMax = null;
  let xtypeValues = [];
  let raceValues = [];

  const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#039;"
  }[ch]));

  function fmtSS(value) {
    const v = Number(value);
    if (!Number.isFinite(v)) return "—";
    return Math.abs(v) <= 1 ? `${(v * 100).toFixed(1)}%` : v.toFixed(2);
  }

  function titleCase(str) {
    return String(str || "")
      .toLowerCase()
      .replace(/\b\w/g, c => c.toUpperCase());
  }

  function hexToRgb(hex) {
    const clean = hex.replace("#", "");
    const num = parseInt(clean, 16);
    return {
      r: (num >> 16) & 255,
      g: (num >> 8) & 255,
      b: num & 255
    };
  }

  function luma(hex) {
    const { r, g, b } = hexToRgb(hex);
    return (0.299 * r + 0.587 * g + 0.114 * b) / 255;
  }

  function uniqueInDataOrder(data, key) {
    const seen = new Set();
    const values = [];

    data.forEach(d => {
      const v = d[key];
      if (v !== null && v !== undefined && String(v) !== "" && !seen.has(String(v))) {
        seen.add(String(v));
        values.push(String(v));
      }
    });

    return values;
  }

  function medianDiff(values) {
    const rounded = [...new Set(
      values
        .filter(Number.isFinite)
        .map(v => Number(v.toFixed(2)))
    )];

    rounded.sort((a, b) => a - b);

    const diffs = [];
    for (let i = 1; i < rounded.length; i++) {
      const d = +(rounded[i] - rounded[i - 1]).toFixed(4);
      if (d > 0.0001) diffs.push(d);
    }

    if (!diffs.length) return 0.1;

    diffs.sort((a, b) => a - b);
    return diffs[Math.floor(diffs.length / 2)];
  }

  function readStatesFromTopology(raw) {
    const topo = raw.content || raw;
    const geoms =
      topo?.objects?.regions?.geometries ||
      topo?.objects?.states?.geometries ||
      [];

    const parsed = geoms.map(g => {
      const p = g.properties || {};
      const fips = String(p.id ?? p.STATEFP ?? "").padStart(2, "0");
      let abbr = String(p.state_id || p.postal || p.abbr || "").toUpperCase();

      if (abbr === "DCC") abbr = "DC";

      return {
        fips,
        abbr,
        name: p.name_lc || titleCase(p.name) || abbr,
        cx: Number(p.cx),
        cy: Number(p.cy)
      };
    }).filter(d =>
      d.fips &&
      d.abbr &&
      Number.isFinite(d.cx) &&
      Number.isFinite(d.cy)
    );

    const xs = parsed.map(d => d.cx);
    const ys = parsed.map(d => d.cy);

    const minX = Math.min(...xs);
    const maxY = Math.max(...ys);
    const stepX = medianDiff(xs);
    const stepY = medianDiff(ys);

    parsed.forEach(d => {
      d.c = Math.round((d.cx - minX) / stepX);
      d.r = Math.round((maxY - d.cy) / stepY);
    });

    const minCol = Math.min(...parsed.map(d => d.c));
    const minRow = Math.min(...parsed.map(d => d.r));

    parsed.forEach(d => {
      d.c -= minCol;
      d.r -= minRow;
    });

    return parsed;
  }

  function normalizeArea(value, abbrToFips) {
    if (value === null || value === undefined) return "";

    const raw = String(value).trim();
    if (!raw) return "";

    const upper = raw.toUpperCase();
    if (abbrToFips[upper]) return abbrToFips[upper];

    const match = raw.match(/\d+/);
    if (!match) return "";

    const digits = match[0];
    if (digits.length > 2) return digits.slice(0, 2);
    return digits.padStart(2, "0");
  }

  function pick(row, names) {
    for (const name of names) {
      if (row[name] !== undefined && row[name] !== null && row[name] !== "") {
        return row[name];
      }
    }
    return "";
  }

  function normalizeRows(rows, stateList) {
    const abbrToFips = {};
    stateList.forEach(s => {
      abbrToFips[s.abbr] = s.fips;
    });

    return rows.map((row, i) => {
      const clean = {};
      Object.keys(row).forEach(k => {
        const key = String(k).trim();
        clean[key] = typeof row[k] === "string" ? row[k].trim() : row[k];
      });

      return {
        _order: i,
        year: pick(clean, ["year", "Year", "YEAR"]),
        area: normalizeArea(pick(clean, ["area", "fips", "state_fips", "state", "state_id", "id"]), abbrToFips),
        area_name: pick(clean, ["area_name", "state_name", "name"]),
        xtype: String(pick(clean, ["xtype", "XTYPE"])),
        racecomp: String(pick(clean, ["racecomp", "race_comp", "race", "RACECOMP"])),
        ss: Number(pick(clean, ["ss", "SS", "value", "Value"]))
      };
    }).filter(d => d.area && Number.isFinite(d.ss));
  }

  function setLatestYear(data) {
    const numericYears = data
      .map(d => Number(d.year))
      .filter(Number.isFinite);

    if (numericYears.length) {
      latestYearIsNumeric = true;
      latestYear = Math.max(...numericYears);
      return;
    }

    latestYearIsNumeric = false;
    latestYear = uniqueInDataOrder(data, "year").at(-1);
  }

  function isLatestYearRow(d) {
    if (latestYear === null || latestYear === undefined || latestYear === "") return true;

    return latestYearIsNumeric
      ? Number(d.year) === latestYear
      : String(d.year) === String(latestYear);
  }

  function quantile(sortedValues, p) {
    if (!sortedValues.length) return null;
    if (sortedValues.length === 1) return sortedValues[0];

    const idx = (sortedValues.length - 1) * p;
    const lo = Math.floor(idx);
    const hi = Math.ceil(idx);
    const h = idx - lo;

    return sortedValues[lo] * (1 - h) + sortedValues[hi] * h;
  }

  function quantileBreaks(values, classes) {
  const sorted = values
    .map(Number)
    .filter(Number.isFinite)
    .sort((a, b) => a - b);

  if (!sorted.length) return [];

  const breaks = [];
  for (let i = 0; i <= classes; i++) {
    breaks.push(quantile(sorted, i / classes));
  }

  return breaks;
}

  function colorForValue(value, breaks) {
    const v = Number(value);
    if (!Number.isFinite(v) || !breaks.length) return NO_DATA_COLOR;

    for (let i = 1; i < breaks.length; i++) {
      if (v <= breaks[i]) return PALETTE[i - 1];
    }

    return PALETTE[PALETTE.length - 1];
  }

  function barPct(value) {
    const v = Number(value);
    if (!Number.isFinite(v) || fixedMin === null || fixedMax === null || fixedMax === fixedMin) return 0;
    return Math.max(0, Math.min(100, ((v - fixedMin) / (fixedMax - fixedMin)) * 100));
  }

  function getStateRows(fips) {
    return allData.filter(d =>
      isLatestYearRow(d) &&
      String(d.area).padStart(2, "0") === String(fips).padStart(2, "0")
    );
  }

  function makeTooltipTable(state) {
    const rows = getStateRows(state.fips);
    const byCombo = {};

    rows.forEach(d => {
      const key = `${d.xtype}|||${d.racecomp}`;
      if (!byCombo[key]) byCombo[key] = d;
    });

    let html = `
      <div class="mtm-tip-title">${esc(state.name)}</div>
      <div class="mtm-mini-table-wrap">
        <table class="mtm-mini-table">
          <thead>
            <tr>
              <th>Family type</th>
              ${raceValues.map(r => `<th>${esc(r)}</th>`).join("")}
            </tr>
          </thead>
          <tbody>
    `;

    xtypeValues.forEach(x => {
      html += `<tr><td class="mtm-mini-rowhead">${esc(x)}</td>`;

      raceValues.forEach(r => {
        const row = byCombo[`${x}|||${r}`];
        const v = row ? Number(row.ss) : NaN;
        const color = Number.isFinite(v) ? colorForValue(v, fixedBreaks) : "#bbb";
        const pct = barPct(v);

        html += `
          <td class="mtm-mini-cell">
            ${
              Number.isFinite(v)
                ? `
                  <div class="mtm-mini-value">${fmtSS(v)}</div>
                  <div class="mtm-mini-bar">
                    <div class="mtm-mini-fill" style="width:${pct}%;background:${color};"></div>
                  </div>
                `
                : `<span class="mtm-mini-muted">—</span>`
            }
          </td>
        `;
      });

      html += `</tr>`;
    });

    html += `
          </tbody>
        </table>
      </div>
    `;

    return html;
  }

  function buildMap() {
    const map = document.getElementById("mtm-map");
    const wrap = document.getElementById("mtm-wrap");
    const tip = document.getElementById("mtm-tip");

    map.innerHTML = "";
    tiles = {};

    const maxCol = Math.max(...states.map(s => s.c));
    const maxRow = Math.max(...states.map(s => s.r));

    const mapWidth = (maxCol + 1) * (TILE_SIZE + TILE_GAP) - TILE_GAP;
    const mapHeight = (maxRow + 1) * (TILE_SIZE + TILE_GAP) - TILE_GAP;

    map.style.width = `${mapWidth}px`;
    map.style.height = `${mapHeight}px`;
    wrap.style.width = `${mapWidth}px`;

    states.forEach(s => {
      const tile = document.createElement("div");

      tile.style.cssText = `
        position:absolute;
        left:${s.c * (TILE_SIZE + TILE_GAP)}px;
        top:${s.r * (TILE_SIZE + TILE_GAP)}px;
        width:${TILE_SIZE}px;
        height:${TILE_SIZE}px;
        border-radius:8px;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:12px;
        font-weight:800;
        cursor:default;
        user-select:none;
        transition:filter .12s, transform .12s;
        background:${NO_DATA_COLOR};
        color:rgba(90,90,90,.58);
      `;

      tile.textContent = s.abbr;
      tile.id = `tl-${s.fips}`;

      tile.addEventListener("mouseenter", () => {
        tip.innerHTML = makeTooltipTable(s);
        tip.style.display = "block";
        tile.style.filter = "brightness(1.08)";
        tile.style.transform = "translateY(-1px)";
      });

      tile.addEventListener("mousemove", e => {
        const wr = wrap.getBoundingClientRect();

        let left = e.clientX - wr.left + 14;
        let top = e.clientY - wr.top + 14;

        const tipWidth = tip.offsetWidth || 520;
        const tipHeight = tip.offsetHeight || 220;

        if (left + tipWidth > mapWidth) left = e.clientX - wr.left - tipWidth - 14;
        if (top + tipHeight > mapHeight) top = e.clientY - wr.top - tipHeight - 14;

        tip.style.left = `${Math.max(0, left)}px`;
        tip.style.top = `${Math.max(0, top)}px`;
      });

      tile.addEventListener("mouseleave", () => {
        tip.style.display = "none";
        tile.style.filter = "";
        tile.style.transform = "";
      });

      tiles[s.fips] = tile;
      map.appendChild(tile);
    });
  }

  function populateFilters(data) {
    const latestData = data.filter(isLatestYearRow);

    xtypeValues = uniqueInDataOrder(latestData, "xtype");
    raceValues = uniqueInDataOrder(latestData, "racecomp");

    selectedXtype = xtypeValues[0] || "";

    const btnWrap = document.getElementById("mtm-xtype-buttons");
    btnWrap.innerHTML = "";

    xtypeValues.forEach(v => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "mtm-xbtn";
      btn.textContent = v;
      btn.dataset.value = v;

      if (String(selectedXtype) === String(v)) {
        btn.classList.add("is-active");
      }

      btn.addEventListener("click", () => {
        selectedXtype = v;

        document.querySelectorAll(".mtm-xbtn").forEach(b => {
          b.classList.toggle("is-active", String(b.dataset.value) === String(v));
        });

        updateMap();
      });

      btnWrap.appendChild(btn);
    });

    const raceSelect = document.getElementById("mtm-race");
    raceSelect.replaceChildren();

    raceValues.forEach(v => {
      raceSelect.appendChild(new Option(v, v));
    });

    if (raceValues.length) {
      raceSelect.value = raceValues[0];
    }
  }

  function getFilteredRows() {
    const race = document.getElementById("mtm-race").value;

    return allData.filter(d =>
      isLatestYearRow(d) &&
      String(d.xtype) === String(selectedXtype) &&
      String(d.racecomp) === String(race)
    );
  }

  function updateMap() {
    const filtered = getFilteredRows();
    const byState = {};

    filtered.forEach(d => {
      const fips = String(d.area).padStart(2, "0");

      /*
        Use ss directly. If duplicate rows exist for the same state/filter,
        use the first row in the CSV's original order.
      */
      if (!byState[fips]) byState[fips] = d;
    });

    Object.keys(tiles).forEach(fips => {
      const tile = tiles[fips];
      const row = byState[fips];

      if (row && Number.isFinite(Number(row.ss))) {
        const value = Number(row.ss);
        const color = colorForValue(value, fixedBreaks);

        tile.style.background = color;
        tile.style.color = luma(color) > 0.58
          ? "rgba(35,25,15,.82)"
          : "rgba(255,255,255,.92)";

        tile.dataset.val = value;
      } else {
        tile.style.background = NO_DATA_COLOR;
        tile.style.color = "rgba(90,90,90,.58)";
        tile.dataset.val = "";
      }
    });
  }

  function buildLegend() {
    const bar = document.getElementById("mtm-leg-bar");
    const minEl = document.getElementById("mtm-leg-min");
    const maxEl = document.getElementById("mtm-leg-max");

    bar.innerHTML = "";

    if (!fixedBreaks.length) {
      minEl.textContent = "";
      maxEl.textContent = "";
      return;
    }

    PALETTE.forEach((color, i) => {
      const swatch = document.createElement("div");
      swatch.style.width = `${Math.max(8, Math.floor(300 / PALETTE.length))}px`;
      swatch.style.height = "14px";
      swatch.style.background = color;
      swatch.title = `${fmtSS(fixedBreaks[i])} – ${fmtSS(fixedBreaks[i + 1])}`;
      bar.appendChild(swatch);
    });

    minEl.textContent = fmtSS(fixedBreaks[0]);
    maxEl.textContent = fmtSS(fixedBreaks[fixedBreaks.length - 1]);
  }

  async function init() {
    try {
      const [csvText, tileJson] = await Promise.all([
        fetch(CSV_URL).then(r => {
          if (!r.ok) throw new Error(`Could not load CSV: ${r.status}`);
          return r.text();
        }),
        fetch(TILE_JSON_URL).then(r => {
          if (!r.ok) throw new Error(`Could not load tile JSON: ${r.status}`);
          return r.json();
        })
      ]);

      states = readStatesFromTopology(tileJson);

      const parsed = Papa.parse(csvText, {
        header: true,
        skipEmptyLines: true,
        dynamicTyping: false
      });

      allData = normalizeRows(parsed.data, states);
      setLatestYear(allData);

      const latestData = allData.filter(isLatestYearRow);
      const allLatestValues = latestData.map(d => Number(d.ss)).filter(Number.isFinite);

      fixedBreaks = quantileBreaks(allLatestValues, 25);
      fixedMin = fixedBreaks[0];
      fixedMax = fixedBreaks[fixedBreaks.length - 1];

      buildMap();
      populateFilters(allData);
      buildLegend();
      updateMap();
    } catch (err) {
      console.error(err);
    }
  }

  document.getElementById("mtm-race").addEventListener("change", updateMap);

  init();
})();
</script>
