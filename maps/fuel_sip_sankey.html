<style>
  :root{
    --navy:#123745;
    --ink:#1c3a45;
    --paper:#ffffff;
    --eco:#5FB8B5;
    --uir:#105972;
    --tech:#359E6F;
    --wf:#DDAA01;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);font-family:'Inter',sans-serif;color:var(--ink);height:100%;overflow:hidden;}
  .page{max-width:1400px;margin:0 auto;padding:18px 40px 16px;height:100vh;display:flex;flex-direction:column;box-sizing:border-box;overflow:hidden;}
  .topline{display:flex;justify-content:flex-end;flex:0 0 auto;}
  .topline span{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--uir);}
  h1{font-size:28px;margin:4px 0 12px;color:var(--navy);font-weight:800;flex:0 0 auto;}
  .subnote{font-size:12px;color:#5a6b72;font-style:italic;margin:-8px 0 10px;flex:0 0 auto;}
  .col-headers{display:flex;justify-content:space-between;padding:0 6px;margin-bottom:4px;flex:0 0 auto;}
  .col-headers .lbl{font-size:13px;font-weight:800;letter-spacing:.03em;color:var(--navy);}
  .col-headers .lbl.right{text-align:right;}
  #chart-wrap{position:relative;background:#fff;border-radius:6px;padding:8px 6px 0;flex:1 1 auto;min-height:0;overflow:hidden;}
  #chart{width:100%;height:100%;display:block;}
  .node-rect{cursor:pointer;transition:opacity .15s ease;}
  .node-rect:hover{filter:brightness(1.08);}
  .tick-rect{cursor:pointer;transition:opacity .15s ease;}
  .link-path{transition:fill-opacity .2s ease;}
  .node-label{font-size:12.5px;font-weight:700;pointer-events:none;}
  .tick-label{font-size:9.5px;fill:#123745;font-weight:700;pointer-events:none;text-anchor:middle;}
  .item-label{font-size:9px;pointer-events:none;}
  .mission-label{font-size:14px;font-weight:800;fill:#fff;letter-spacing:.05em;pointer-events:none;}
  .axis-line{stroke:var(--navy);stroke-width:1.4;}
  .axis-cap{stroke:var(--navy);stroke-width:1.4;}
  .axis-text{font-size:12px;font-weight:700;fill:var(--navy);text-anchor:middle;}
  .hint{font-size:12px;color:#7a8890;text-align:center;margin-top:2px;padding-bottom:10px;}

  .divider{border:none;border-top:1px solid #cfd9dc;margin:14px 0 10px;flex:0 0 auto;}
  .footer-title{font-size:13px;font-weight:800;color:var(--navy);margin-bottom:8px;flex:0 0 auto;}
  .footer-title em{font-style:normal;font-weight:600;color:#3b4b52;}
  .activities-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:4px 30px;font-size:12px;line-height:1.3;flex:0 0 auto;}
  .activities-grid .item{display:flex;gap:8px;}
  .activities-grid .num{font-weight:700;color:var(--uir);flex:0 0 auto;}
  .fig-caption{margin-top:22px;font-size:13px;}
  .fig-caption b{color:var(--navy);}
  .report-footer{margin-top:26px;display:flex;justify-content:space-between;align-items:center;border-top:2px solid var(--navy);padding-top:10px;font-size:12px;font-weight:700;color:var(--navy);}

  /* ---- Drill-down panel ---- */
  #overlay{position:fixed;inset:0;background:rgba(10,25,30,.45);opacity:0;pointer-events:none;transition:opacity .2s ease;z-index:40;}
  #overlay.show{opacity:1;pointer-events:auto;}
  #panel{position:fixed;top:0;right:0;height:100%;width:min(760px,92vw);background:#fff;box-shadow:-8px 0 30px rgba(0,0,0,.25);
    transform:translateX(100%);transition:transform .25s ease;z-index:41;display:flex;flex-direction:column;}
  #panel.show{transform:translateX(0);}
  #panel-head{padding:22px 26px 16px;color:#fff;position:relative;flex:0 0 auto;}
  #panel-head .eyebrow{font-size:12px;letter-spacing:.08em;font-weight:700;opacity:.85;}
  #panel-head h2{margin:4px 0 8px;font-size:24px;font-weight:800;}
  #panel-head p{margin:0;font-size:13.5px;line-height:1.5;max-width:640px;opacity:.96;}
  #panel-close{position:absolute;top:16px;right:20px;background:rgba(255,255,255,.18);border:none;color:#fff;
    width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;line-height:1;}
  #panel-close:hover{background:rgba(255,255,255,.32);}
  #goal-tabs{display:flex;gap:6px;padding:14px 26px 0;flex:0 0 auto;flex-wrap:wrap;}
  .goal-tab{border:none;padding:8px 14px;border-radius:6px 6px 0 0;font-size:12.5px;font-weight:700;cursor:pointer;
    background:#eef2f3;color:#5a6b72;}
  .goal-tab.active{color:#fff;}
  #legend-row{display:flex;gap:14px;align-items:center;padding:14px 26px;flex:0 0 auto;flex-wrap:wrap;border-bottom:1px solid #e5eaec;}
  #legend-row .key-lbl{font-size:11px;font-weight:800;color:#5a6b72;letter-spacing:.06em;}
  .swatch{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;color:#3b4b52;}
  .swatch i{width:16px;height:16px;border-radius:3px;display:inline-block;}
  #panel-body{padding:20px 26px 40px;overflow-y:auto;flex:1 1 auto;}
  .goal-title{font-size:16px;font-weight:800;color:var(--navy);margin:0 0 16px;padding:10px 14px;border-left:5px solid #ccc;background:#f5f7f8;border-radius:3px;}
  .tree-root{display:flex;flex-direction:column;gap:14px;}
  .tree-branch{display:flex;align-items:center;}
  .tree-box{padding:10px 14px;border-radius:5px;font-size:12.5px;font-weight:600;line-height:1.35;min-width:150px;max-width:230px;box-shadow:0 1px 2px rgba(0,0,0,.08);}
  .tree-box.tier-primary,.tree-box.tier-secondary{color:#fff;font-weight:700;}
  .tree-box.tier-activity,.tree-box.tier-project{color:#1c3a45;}
  .tree-children{display:flex;flex-direction:column;margin-left:22px;padding-left:20px;border-left:2px solid #d7dee0;gap:10px;position:relative;}
  .tree-children .tree-branch{position:relative;}
  .tree-children .tree-branch::before{content:"";position:absolute;left:-20px;top:50%;width:20px;height:2px;background:#d7dee0;}
  .obj-list{display:flex;flex-direction:column;gap:8px;}
  .obj-list .row{display:flex;gap:10px;padding:10px 12px;background:#f5f7f8;border-radius:5px;font-size:13px;}
  .obj-list .row b{color:var(--uir);min-width:20px;}
  .target-feed{display:flex;flex-direction:column;gap:10px;}
  .target-feed .row{padding:12px 14px;border-radius:6px;background:#f5f7f8;font-size:13.5px;font-weight:700;display:flex;justify-content:space-between;align-items:center;}
  .target-feed .row span.tag{font-size:11px;font-weight:800;color:#fff;padding:3px 9px;border-radius:10px;}

  @media (max-width:900px){
    .activities-grid{grid-template-columns:1fr 1fr;}
    .page{padding:12px 16px;}
  }
</style>
</head>

/* Explicit activity -> goal(s) mapping.

  6:["m1g4","m2g4","m3g4"],
  7:["m1g4"],
  8:["m1g1"],
  9:["m1g1","m1g2"],
  10:["m1g1"],
  11:["m1g1","m1g2"],
  12:["m1g1","m1g2"],
  13:["m1g2","m2g1"],
  14:["m1g2","m1g4"],
  15:["m1g2","m2g3"],
  16:["m1g3"],
  17:["m1g3"],
  18:["m1g2"],
  19:["m2g1","m3g1"],
  20:["m3g2","m3g3"],
  21:["m3g2","m3g3"]
};

// Derived, not hand-maintained: one entry per (activity, goal) pair, tagged with
// the activity number (4th element) so we can pin its ribbon to the right tick.
const LINKS_OBJ_TO_GOAL = [];
OBJECTIVES.forEach(o=>{
  o.items.forEach(num=>{
    ITEM_TO_GOALS[num].forEach(goalId=>{
      LINKS_OBJ_TO_GOAL.push([o.id, goalId, 1, num]);
    });
  });
});

// Goal -> Target flows (conserved in/out per goal)
const LINKS_GOAL_TO_TGT = [
  ["m1g1","tgt-size",1],["m1g1","tgt-valuation",1],
  ["m1g2","tgt-size",1],["m1g2","tgt-employ-fuel",1],
  ["m1g3","tgt-valuation",1],["m1g3","tgt-size",1],
  ["m1g4","tgt-valuation",1],
  ["m2g1","tgt-employ-fuel",1],["m2g1","tgt-size",1],
  ["m2g2","tgt-employ-fuel",1],["m2g2","tgt-valuation",1],
  ["m2g3","tgt-employ-fuel",1],
  ["m2g4","tgt-employ-fuel",1],["m2g4","tgt-employ-lasink",1],
  ["m3g1","tgt-employ-lasink",1],["m3g1","tgt-employ-fuel",1],
  ["m3g2","tgt-employ-lasink",1],["m3g2","tgt-employ-fuel",1],
  ["m3g3","tgt-employ-lasink",1],["m3g3","tgt-employ-fuel",1],
  ["m3g4","tgt-employ-lasink",1]
];

/* Give the Target column its own numbered ticks, the same way the activities on
   the left are numbered 1-21 -- just continuing that sequence across the four
   Target blocks (top to bottom, in the order each flow appears above). This is
   what every incoming ribbon gets pinned to, so Targets fill evenly instead of
   feeding in sparsely. */
let _tgtTickSeq = 1;
const TARGET_TICK_BY_LINK = new Map(); // index into LINKS_GOAL_TO_TGT -> tick number
const TARGET_ITEMS = {};
TARGETS.forEach(t=>{
  const nums = [];
  LINKS_GOAL_TO_TGT.forEach((l,li)=>{
    if(l[1]===t.id){
      const num = _tgtTickSeq++;
      TARGET_TICK_BY_LINK.set(li, num);
      nums.push(num);
    }
  });
  TARGET_ITEMS[t.id] = nums;
});

/* ============================= BUILD GRAPH + RENDER (re-run on resize) ============================= */
function luminance(hex){
  const c = d3.color(hex).rgb();
  return (0.299*c.r + 0.587*c.g + 0.114*c.b);
}
function textColorFor(hex){ return luminance(hex) > 150 ? "#123745" : "#ffffff"; }

const svg = d3.select("#chart");

function renderChart(){
  const wrapEl = document.getElementById("chart-wrap");
  const cw = wrapEl.clientWidth || 1000;
  const ch = wrapEl.clientHeight || 600;

  const W = 1320;
  const MARGIN = {top:10,right:230,bottom:60,left:210};
  const GAP = 10;
  const totalGap = GAP*2;

  // Pick a sankey extent height (H) so that the FINAL rendered viewBox's aspect
  // ratio exactly matches the container's aspect ratio. With matching aspect
  // ratios, "xMidYMid meet" scales uniformly (no letterboxing, no distortion) --
  // the chart always fills the full width, and only the vertical proportions
  // (node spacing / link curvature) change to use whatever height is available.
  let targetTotalH = W * (ch/cw);
  let H = targetTotalH - 65 - totalGap + MARGIN.bottom;
  H = Math.max(420, H); // never compress below a legible minimum

  const nodes = [];
  OBJECTIVES.forEach(o=>nodes.push({id:o.id, kind:"objective", name:o.name, color:o.color, items:o.items}));
  MISSIONS.forEach((m,mi)=>{
    for(let g=0; g<4; g++){
      nodes.push({id:m.id+"g"+(g+1), kind:"goal", missionIndex:mi, goalIndex:g, name:String(g+1)});
    }
  });
  TARGETS.forEach(t=>nodes.push({id:t.id, kind:"target", name:t.name, color:t.color, items:TARGET_ITEMS[t.id]}));

  const links = [];
  LINKS_OBJ_TO_GOAL.forEach(([s,t,v,num])=>links.push({source:s,target:t,value:v,itemNum:num}));
  LINKS_GOAL_TO_TGT.forEach(([s,t,v],li)=>links.push({source:s,target:t,value:v,tgtTick:TARGET_TICK_BY_LINK.get(li)}));

  const nodeIndex = new Map(nodes.map((n,i)=>[n.id,i]));
  const graphLinks = links.map(l=>({source:nodeIndex.get(l.source), target:nodeIndex.get(l.target), value:l.value, sId:l.source, tId:l.target, itemNum:l.itemNum, tgtTick:l.tgtTick}));

  const sankeyGen = d3.sankey()
    .nodeId(d=>d.index)
    .nodeWidth(16)
    .nodePadding(5)
    .nodeSort(null)
    .extent([[MARGIN.left, MARGIN.top], [W-MARGIN.right, H-MARGIN.bottom]]);

  const graph = sankeyGen({
    nodes: nodes.map((d,i)=>Object.assign({},d,{index:i})),
    links: graphLinks.map(d=>Object.assign({},d))
  });

  // ---- widen the objective (source) and target blocks into full labeled panels ----
  const BLOCK_W = 200;
  graph.nodes.forEach(n=>{
    if(n.kind==="objective") n.x0 = n.x1 - BLOCK_W;
    if(n.kind==="target") n.x1 = n.x0 + BLOCK_W;
  });

  // ---- make each mission's goal ticks uniform height, AND give the three
  // missions roughly equal total height -- all three have exactly 4 goals, so an
  // equal three-way split (rather than sizing by how much flow value happens to
  // pass through each) is what actually reflects that structure ----
  const goalNodes = graph.nodes.filter(n=>n.kind==="goal");
  const byMission = [[],[],[]];
  goalNodes.forEach(n=> byMission[n.missionIndex].push(n));
  const colTop = MARGIN.top, colBottom = H - MARGIN.bottom;
  const missionH = (colBottom-colTop) / byMission.length;
  byMission.forEach((group,mi)=>{
    group.sort((a,b)=>a.goalIndex-b.goalIndex);
    const groupTop = colTop + mi*missionH;
    const groupBottom = groupTop + missionH;
    const each = (groupBottom-groupTop)/group.length;
    group.forEach((n,i)=>{
      const newY0 = groupTop + i*each;
      // Evenly space this goal's links along its new tick height -- rather than
      // proportionally remapping wherever the original layout happened to stack
      // them, which can leave near-zero gaps between some links when a goal has
      // many incoming flows (and forces those particular ribbons to render wafer-thin).
      const srcSorted = n.sourceLinks.slice().sort((a,b)=>a.y0-b.y0);
      const srcRow = each/(srcSorted.length || 1);
      srcSorted.forEach((l,idx)=>{ l.y0 = newY0 + idx*srcRow + srcRow/2; });

      const tgtSorted = n.targetLinks.slice().sort((a,b)=>a.y1-b.y1);
      const tgtRow = each/(tgtSorted.length || 1);
      tgtSorted.forEach((l,idx)=>{ l.y1 = newY0 + idx*tgtRow + tgtRow/2; });

      n.y0 = newY0; n.y1 = newY0+each;
    });
  });

  // ---- add extra vertical gap between mission groups within the goal column ----
  goalNodes.sort((a,b)=>a.y0-b.y0);
  let shiftForMission = [0,0,0];
  {
    let cum = 0;
    for(let mi=0; mi<3; mi++){
      shiftForMission[mi] = cum;
      cum += GAP;
    }
  }
  goalNodes.forEach(n=>{
    const delta = shiftForMission[n.missionIndex];
    if(delta){
      n.y0 += delta; n.y1 += delta;
      n.sourceLinks.forEach(l=>l.y0 += delta);
      n.targetLinks.forEach(l=>l.y1 += delta);
    }
  });
  const newBottom = H - MARGIN.bottom + totalGap;
  const svgHeight = newBottom + 65;

  // ---- size objective & target blocks proportionally to how many "end nodes" they
  // carry (ticks for objectives, incoming flow weight for targets) instead of forcing
  // every block to the same height. Blocks can differ in height from each other, but
  // together they always span the exact same top-to-bottom range as the goal column --
  // no leftover blank space inside a block, and no overshoot past the last one. ----
  const endGap = 6;
  ["objective","target"].forEach(kind=>{
    const list = graph.nodes.filter(n=>n.kind===kind);
    list.sort((a,b)=>a.y0-b.y0);
    const top = MARGIN.top, bottom = newBottom;
    const n = list.length;
    const totalGapAll = (n-1)*endGap;
    const availableH = bottom - top - totalGapAll;
    const totalWeight = d3.sum(list, node => kind==="objective" ? node.items.length : node.value);
    let cursor = top;
    list.forEach(node=>{
      const oldY0=node.y0, oldH=node.y1-node.y0;
      const w = kind==="objective" ? node.items.length : node.value;
      const h = availableH * (w/totalWeight);
      const newY0 = cursor;

      if(kind==="objective"){
        // Pin every activity's ribbon(s) to its own dedicated row (in item order),
        // so the flow(s) leaving tick N are unambiguously activity N's -- and if
        // activity N fans out to multiple goals, its row splits evenly between them.
        const rowH = h/node.items.length;
        node.items.forEach((num,i)=>{
          const rowY0 = newY0 + i*rowH;
          const linksForItem = node.sourceLinks.filter(l=>l.itemNum===num);
          const subH = rowH/linksForItem.length;
          linksForItem.forEach((l,j)=>{ l.y0 = rowY0 + j*subH + subH/2; });
        });
      } else {
        // Mirror the objective side: give each numbered incoming flow its own
        // dedicated row, so Targets fill evenly top-to-bottom instead of
        // clustering wherever the raw layout happened to stack them.
        const rowH = h/node.items.length;
        const byTick = new Map(node.targetLinks.map(l=>[l.tgtTick, l]));
        node.items.forEach((num,i)=>{
          const l = byTick.get(num);
          if(l) l.y1 = newY0 + i*rowH + rowH/2;
        });
      }

      node.y0 = newY0; node.y1 = newY0+h;
      cursor += h + endGap;
    });
  });

  svg.selectAll("*").remove();
  svg.attr("viewBox", `0 0 ${W} ${svgHeight}`).attr("preserveAspectRatio", "xMidYMid meet");
  const defs = svg.append("defs");

  // gradient defs for obj->goal and goal->target links, based on source color -> target tint
  graph.links.forEach((l,i)=>{
    const grad = defs.append("linearGradient").attr("id","grad"+i).attr("gradientUnits","userSpaceOnUse")
      .attr("x1", l.source.x1).attr("x2", l.target.x0);
    let c0, c1;
    if(l.sId.startsWith("obj-")){
      c0 = OBJECTIVES.find(o=>o.id===l.sId).color;
      c1 = MISSIONS[l.target.missionIndex].base;
    } else {
      c0 = MISSIONS[l.source.missionIndex].base;
      c1 = TARGETS.find(t=>t.id===l.tId).color;
    }
    grad.append("stop").attr("offset","0%").attr("stop-color",c0);
    grad.append("stop").attr("offset","100%").attr("stop-color",c1);
  });

  // ---- give every link a safe width AT EACH END SEPARATELY, then draw it as a
  // tapered ribbon rather than a constant-width stroke. A flow is allowed to be
  // roomier at one end than the other (e.g. wide where few other activities
  // compete for space, narrower where a goal is crowded with many incoming
  // flows) -- forcing one uniform width across the whole link is what was
  // shrinking otherwise-fine flows down to slivers. ----
  function safeWidths(nodes, side){
    const out = new Map();
    nodes.forEach(node=>{
      const arr = side==="source" ? node.sourceLinks : node.targetLinks;
      if(!arr || !arr.length) return;
      const getY = l => side==="source" ? l.y0 : l.y1;
      const sorted = arr.slice().sort((a,b)=>getY(a)-getY(b));
      sorted.forEach((l,i)=>{
        const y = getY(l);
        const prevGap = i===0 ? (y-node.y0)*2 : (y-getY(sorted[i-1]));
        const nextGap = i===sorted.length-1 ? (node.y1-y)*2 : (getY(sorted[i+1])-y);
        const slot = Math.max(1, Math.min(prevGap,nextGap));
        out.set(l, Math.min(out.get(l) ?? Infinity, slot));
      });
    });
    return out;
  }
  const srcSlots = safeWidths(graph.nodes, "source");
  const tgtSlots = safeWidths(graph.nodes, "target");
  graph.links.forEach(l=>{
    l.wSource = Math.max(1.5, Math.min(l.width, (srcSlots.get(l) ?? l.width)*0.82));
    l.wTarget = Math.max(1.5, Math.min(l.width, (tgtSlots.get(l) ?? l.width)*0.82));
  });

  function ribbonPath(l){
    const x0 = l.source.x1, x1 = l.target.x0;
    const xm = (x0+x1)/2;
    const sy0 = l.y0 - l.wSource/2, sy1 = l.y0 + l.wSource/2;
    const ty0 = l.y1 - l.wTarget/2, ty1 = l.y1 + l.wTarget/2;
    return `M${x0},${sy0}C${xm},${sy0} ${xm},${ty0} ${x1},${ty0}L${x1},${ty1}C${xm},${ty1} ${xm},${sy1} ${x0},${sy1}Z`;
  }

  const linkG = svg.append("g");
  const linkPaths = linkG.selectAll("path").data(graph.links).join("path")
    .attr("class","link-path")
    .attr("d", ribbonPath)
    .attr("fill", (d,i)=>`url(#grad${i})`)
    .attr("stroke","none")
    .attr("fill-opacity", 0.45);

  function highlight(nodeId){
    if(!nodeId){
      linkPaths.attr("fill-opacity", 0.45);
      return;
    }
    const ids = Array.isArray(nodeId) ? new Set(nodeId) : new Set([nodeId]);
    linkPaths.attr("fill-opacity", l => (ids.has(l.sId) || ids.has(l.tId)) ? 0.85 : 0.08);
  }

  /* ---- Objective & Target block nodes ---- */
  const blockNodes = graph.nodes.filter(n=>n.kind!=="goal");
  const blockG = svg.append("g").selectAll("g").data(blockNodes).join("g")
    .attr("class","block-node")
    .style("cursor","pointer")
    .on("mouseenter", (e,d)=>highlight(d.id))
    .on("mouseleave", ()=>highlight(null))
    .on("click", (e,d)=> d.kind==="objective" ? openObjective(d) : openTarget(d));

  blockG.append("rect")
    .attr("class","node-rect")
    .attr("x", d=>d.x0).attr("y", d=>d.y0)
    .attr("width", d=>d.x1-d.x0).attr("height", d=>Math.max(2,d.y1-d.y0))
    .attr("fill", d=>d.color)
    .attr("rx", 3);

  // objective tick marks + item numbers (near the right edge, where flows emerge)
  const TICK_ZONE = 26;
  blockG.filter(d=>d.kind==="objective").each(function(d){
    const g = d3.select(this);
    const h = d.y1-d.y0;
    const n = d.items.length;
    const each = h/n;
    const txtColor = textColorFor(d.color);
    d.items.forEach((num,i)=>{
      const y = d.y0 + i*each;
      if(i>0){
        g.append("line").attr("x1",d.x1-TICK_ZONE).attr("x2",d.x1).attr("y1",y).attr("y2",y)
          .attr("stroke", txtColor).attr("stroke-width",1.1).attr("opacity",0.55);
      }
      g.append("text").attr("class","item-label")
        .attr("x", d.x1-TICK_ZONE/2).attr("y", y+each/2+3)
        .attr("text-anchor","middle")
        .attr("fill", txtColor).text(num);
    });
    // vertical divider between name area and tick zone
    g.append("line").attr("x1",d.x1-TICK_ZONE).attr("x2",d.x1-TICK_ZONE).attr("y1",d.y0).attr("y2",d.y1)
      .attr("stroke", txtColor).attr("stroke-width",1).attr("opacity",0.4);
  });

  // objective name labels (centered inside the block, left of the tick zone)
  blockG.filter(d=>d.kind==="objective").append("text")
    .attr("class","node-label")
    .attr("y", d=>(d.y0+d.y1)/2)
    .attr("text-anchor","middle").attr("dominant-baseline","middle")
    .attr("fill", d=>textColorFor(d.color))
    .each(function(d){
      const cx = d.x0 + (d.x1-d.x0-TICK_ZONE)/2;
      const words = d.name.split(" ");
      const mid = Math.ceil(words.length/2);
      const l1 = words.slice(0,mid).join(" "), l2 = words.slice(mid).join(" ");
      d3.select(this).attr("fill", textColorFor(d.color));
      d3.select(this).append("tspan").attr("x", cx).attr("dy","-0.3em").text(l1);
      d3.select(this).append("tspan").attr("x", cx).attr("dy","1.15em").text(l2);
    });

  // target tick marks + numbers (near the LEFT edge, where flows arrive) --
  // continues the same 1-21 numbering used on the objective side
  blockG.filter(d=>d.kind==="target").each(function(d){
    const g = d3.select(this);
    const h = d.y1-d.y0;
    const n = d.items.length;
    const each = h/n;
    const txtColor = textColorFor(d.color);
    d.items.forEach((num,i)=>{
      const y = d.y0 + i*each;
      if(i>0){
        g.append("line").attr("x1",d.x0).attr("x2",d.x0+TICK_ZONE).attr("y1",y).attr("y2",y)
          .attr("stroke", txtColor).attr("stroke-width",1.1).attr("opacity",0.55);
      }
      g.append("text").attr("class","item-label")
        .attr("x", d.x0+TICK_ZONE/2).attr("y", y+each/2+3)
        .attr("text-anchor","middle")
        .attr("fill", txtColor).text(num);
    });
    // vertical divider between the tick zone and the name area
    g.append("line").attr("x1",d.x0+TICK_ZONE).attr("x2",d.x0+TICK_ZONE).attr("y1",d.y0).attr("y2",d.y1)
      .attr("stroke", txtColor).attr("stroke-width",1).attr("opacity",0.4);
  });

  // target labels (inside block, right of the tick zone, wrapped)
  blockG.filter(d=>d.kind==="target").each(function(d){
    const g = d3.select(this);
    const cx = d.x0 + TICK_ZONE + (d.x1-d.x0-TICK_ZONE)/2, cy=(d.y0+d.y1)/2;
    const words = d.name.split(" ");
    const lines = [];
    let line = [];
    words.forEach(w=>{
      const test = line.concat([w]).join(" ");
      if(test.length>17 && line.length){ lines.push(line.join(" ")); line=[w]; }
      else line.push(w);
    });
    if(line.length) lines.push(line.join(" "));
    const t = g.append("text").attr("class","node-label").attr("x",cx).attr("y",cy)
      .attr("text-anchor","middle").attr("dominant-baseline","middle")
      .attr("fill", textColorFor(d.color));
    const startDy = -(lines.length-1)*0.6;
    lines.forEach((l,i)=> t.append("tspan").attr("x",cx).attr("dy", i===0? startDy+"em" : "1.2em").text(l));
  });

  /* ---- Mission bars (decorative label, drawn first so goal ticks sit on top of the link start) ---- */
  const missionBarW = 46;
  MISSIONS.forEach((m,mi)=>{
    const gnodes = goalNodes.filter(n=>n.missionIndex===mi);
    const y0 = d3.min(gnodes,n=>n.y0), y1 = d3.max(gnodes,n=>n.y1);
    const x0 = gnodes[0].x1 - 0; // right edge of tick column
    const barX0 = x0, barX1 = x0 + missionBarW;
    // extend goal node x1 to bar's right edge conceptually for link start point
    gnodes.forEach(n=>{ n.x1 = barX1; });
    svg.append("rect").attr("x", barX0).attr("y", y0).attr("width", barX1-barX0).attr("height", y1-y0)
      .attr("fill", m.base).attr("rx",2)
      .style("cursor","pointer")
      .on("mouseenter", ()=>highlight(gnodes.map(n=>n.id)))
      .on("mouseleave", ()=>highlight(null))
      .on("click", ()=>openMission(mi, 0));
    const cx = (barX0+barX1)/2, cy=(y0+y1)/2;
    svg.append("text").attr("class","mission-label")
      .attr("x", cx).attr("y", cy)
      .attr("text-anchor","middle").attr("dominant-baseline","middle")
      .attr("transform", `rotate(-90 ${cx} ${cy})`)
      .style("pointer-events","none")
      .text(m.name);
  });

  // NOTE: because we mutated goal node x1 AFTER path generation for obj->goal (target side)
  // and BEFORE goal->target (source side), recompute the paths now that x1 changed.
  linkPaths.attr("d", ribbonPath);
  // refresh gradient x2/x1 endpoints to match new positions
  graph.links.forEach((l,i)=>{
    d3.select("#grad"+i).attr("x1", l.source.x1).attr("x2", l.target.x0);
  });

  /* ---- goal tick nodes (drawn above bars/links) ---- */
  const tickG = svg.append("g").selectAll("g").data(goalNodes).join("g")
    .style("cursor","pointer")
    .on("mouseenter", (e,d)=>highlight(d.id))
    .on("mouseleave", ()=>highlight(null))
    .on("click", (e,d)=>openMission(d.missionIndex, d.goalIndex));

  const tickWidth = 16;
  tickG.append("rect")
    .attr("class","tick-rect")
    .attr("x", d=>d.x0).attr("y", d=>d.y0)
    .attr("width", tickWidth).attr("height", d=>Math.max(2,d.y1-d.y0))
    .attr("fill", d=> d3.color(MISSIONS[d.missionIndex].base).brighter(0.9))
    .attr("stroke", d=>MISSIONS[d.missionIndex].base).attr("stroke-width",1);

  tickG.append("text").attr("class","tick-label")
    .attr("x", d=>d.x0+tickWidth/2).attr("y", d=>(d.y0+d.y1)/2+3)
    .attr("fill","#123745")
    .text(d=>d.goalIndex+1);

  /* ---- Years axis ---- */
  const axisY = newBottom + 25;
  const axisGap = 20;
  const axisLeft = d3.min(graph.nodes.filter(n=>n.kind==="objective"), n=>n.x0);
  const axisRight = d3.max(graph.nodes.filter(n=>n.kind==="target"), n=>n.x1);
  const axisHalfW = (axisRight - axisLeft - axisGap) / 2;

  function axisSpan(x0,x1,label){
    const g = svg.append("g");
    g.append("line").attr("class","axis-line").attr("x1",x0+6).attr("x2",x1-6).attr("y1",axisY).attr("y2",axisY);
    g.append("line").attr("class","axis-cap").attr("x1",x0+6).attr("x2",x0+6).attr("y1",axisY-6).attr("y2",axisY+6);
    g.append("line").attr("class","axis-cap").attr("x1",x1-6).attr("x2",x1-6).attr("y1",axisY-6).attr("y2",axisY+6);
    g.append("text").attr("class","axis-text").attr("x",(x0+x1)/2).attr("y",axisY-10).text(label);
  }
  axisSpan(axisLeft, axisLeft+axisHalfW, "YEARS 1-2");
  axisSpan(axisLeft+axisHalfW+axisGap, axisRight, "YEARS 3-5");
}

function debounce(fn, ms){
  let t;
  return function(){ clearTimeout(t); t = setTimeout(fn, ms); };
}

/* ============================= ACTIVITIES FOOTER LIST ============================= */
const gridEl = document.getElementById("activities-grid");
for(let i=1;i<=21;i++){
  const div = document.createElement("div");
  div.className="item";
  div.innerHTML = `<span class="num">${i}.</span><span>${ACTIVITIES[i]}</span>`;
  gridEl.appendChild(div);
}

// Build/rebuild the chart now that the layout (including the activities list
// above it) has settled, and again whenever the window resizes.
renderChart();
window.addEventListener("resize", debounce(renderChart, 150));

/* ============================= DRILL-DOWN PANEL ============================= */
const overlay = document.getElementById("overlay");
const panel = document.getElementById("panel");
const panelHead = document.getElementById("panel-head");
const panelEyebrow = document.getElementById("panel-eyebrow");
const panelTitle = document.getElementById("panel-title");
const panelDesc = document.getElementById("panel-desc");
const goalTabsEl = document.getElementById("goal-tabs");
const panelBody = document.getElementById("panel-body");
const legendRow = document.getElementById("legend-row");

function closePanel(){
  overlay.classList.remove("show");
  panel.classList.remove("show");
}
document.getElementById("panel-close").addEventListener("click", closePanel);
overlay.addEventListener("click", closePanel);

function renderTreeNode(node, ramp){
  const tierColor = {primary:ramp[1], secondary:ramp[2], activity:ramp[3], project:ramp[4]}[node.tier];
  const wrap = document.createElement("div");
  wrap.className = "tree-branch";
  const box = document.createElement("div");
  box.className = "tree-box tier-"+node.tier;
  box.style.background = tierColor;
  box.textContent = node.label;
  wrap.appendChild(box);
  if(node.children && node.children.length){
    const kids = document.createElement("div");
    kids.className = "tree-children";
    node.children.forEach(c=>kids.appendChild(renderTreeNode(c, ramp)));
    wrap.appendChild(kids);
  }
  return wrap;
}

function openMission(missionIndex, goalIndex){
  const m = MISSIONS[missionIndex];
  panelHead.style.background = m.base;
  panelEyebrow.textContent = m.name;
  panelTitle.textContent = "Implementation Plan";
  panelDesc.textContent = m.desc;
  legendRow.style.display = "flex";
  const swatches = legendRow.querySelectorAll(".swatch i");
  swatches[0].style.background = m.ramp[1];
  swatches[1].style.background = m.ramp[2];
  swatches[2].style.background = m.ramp[3];
  swatches[3].style.background = m.ramp[4];

  goalTabsEl.innerHTML = "";
  m.goals.forEach((g,i)=>{
    const b = document.createElement("button");
    b.className = "goal-tab" + (i===goalIndex ? " active" : "");
    b.style.background = i===goalIndex ? m.base : "#eef2f3";
    b.textContent = "GOAL " + (i+1);
    b.addEventListener("click", ()=>openMission(missionIndex, i));
    goalTabsEl.appendChild(b);
  });

  panelBody.innerHTML = "";
  const goal = m.goals[goalIndex];
  const titleEl = document.createElement("div");
  titleEl.className = "goal-title";
  titleEl.style.borderLeftColor = m.base;
  titleEl.textContent = "GOAL " + (goalIndex+1) + ":  " + goal.title;
  panelBody.appendChild(titleEl);

  const root = document.createElement("div");
  root.className = "tree-root";
  goal.tree.forEach(n=>root.appendChild(renderTreeNode(n, m.ramp)));
  panelBody.appendChild(root);

  overlay.classList.add("show");
  panel.classList.add("show");
}

function openObjective(d){
  panelHead.style.background = d.color;
  panelEyebrow.textContent = "CORE PROGRAMMATIC OBJECTIVE";
  panelTitle.textContent = d.name;
  panelDesc.textContent = "Years 1–2 foundational activities and projects that build toward FUEL’s three Missions.";
  legendRow.style.display = "none";
  goalTabsEl.innerHTML = "";

  panelBody.innerHTML = "";
  const list = document.createElement("div");
  list.className = "obj-list";
  d.items.forEach(num=>{
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<b>${num}.</b><span>${ACTIVITIES[num]}</span>`;
    list.appendChild(row);
  });
  panelBody.appendChild(list);

  overlay.classList.add("show");
  panel.classList.add("show");
}

function openTarget(d){
  panelHead.style.background = d.color;
  panelEyebrow.textContent = "TARGET";
  panelTitle.textContent = d.name;
  panelDesc.textContent = "Outcome measured across Years 3–5, fed by the Mission goals below.";
  legendRow.style.display = "none";
  goalTabsEl.innerHTML = "";

  panelBody.innerHTML = "";
  const feeders = LINKS_GOAL_TO_TGT.filter(l=>l[1]===d.id).map(l=>l[0]);
  const wrap = document.createElement("div");
  wrap.className = "target-feed";
  feeders.forEach(gid=>{
    const mi = MISSIONS.findIndex(m=>gid.startsWith(m.id));
    const gi = parseInt(gid.slice(-1),10)-1;
    const m = MISSIONS[mi];
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<span>${m.name} — Goal ${gi+1}: ${m.goals[gi].title}</span><span class="tag" style="background:${m.base}">VIEW</span>`;
    row.style.cursor = "pointer";
    row.addEventListener("click", ()=>openMission(mi, gi));
    wrap.appendChild(row);
  });
  panelBody.appendChild(wrap);

  overlay.classList.add("show");
  panel.classList.add("show");
}
</script>
</body>
</html>
