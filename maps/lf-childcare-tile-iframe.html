<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Childcare Labor Force Participation</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      font-family: "Inter", Arial, Helvetica, sans-serif;
    }

    html, body {
      margin: 0;
      font-family: "Inter", Arial, Helvetica, sans-serif;
      background: #fff;
      color: #191919;
    }

    #root {
      width: min(100%, 1200px);
      margin: 0 auto;
      display: flex;
      flex-direction: column;
    }

    .header {
      flex: 0 0 auto;
      padding: 0;
      width: 100%;
      margin: 0 auto 18px auto;
    }

    .header h1 {
      font-size: 18px;
      font-weight: 600;
      line-height: 1.2;
      margin: 0 0 5px 0;
    }

    .header .subtitle {
      font-size: 15px;
      line-height: 1.25;
      font-weight: 400;
      color: #191919;
      margin: 0 0 18px 0;
    }

    .toggle-row {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      margin-bottom: 0;
    }

    .toggle-label {
      color: #666;
      cursor: pointer;
      user-select: none;
      transition: color .2s;
      white-space: nowrap;
    }

    .toggle-label.active {
      color: #191919;
      font-weight: 500;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      position: absolute;
    }

    .track {
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: #ccc;
      transition: background .25s;
    }

    .switch input:checked + .track {
      background: #191919;
    }

    .knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #fff;
      transition: transform .25s;
      pointer-events: none;
    }

    .switch input:checked ~ .knob {
      transform: translateX(16px);
    }

    .frame-shell {
      width: 100%;
    }

    iframe {
      width: 100%;
      height: 900px;
      border: none;
      display: block;
    }

    @media (max-width: 680px) {
      #root {
        width: 100%;
      }

      .toggle-row {
        gap: 8px;
        flex-wrap: wrap;
      }

      iframe {
        height: 1100px;
      }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="header">
      <h1>Predicted increase from observed labor force participation rates at affordability-capped childcare cost thresholds</h1>
      <p class="subtitle">Parents with children aged 0-12, 2024</p>
      <div class="toggle-row">
        <span class="toggle-label active" id="label-left">View by race</span>
        <label class="switch">
          <input type="checkbox" id="toggle" />
          <span class="track"></span>
          <span class="knob"></span>
        </label>
        <span class="toggle-label" id="label-right">View by sex/marital status</span>
      </div>
    </div>

    <div class="frame-shell">
      <iframe id="map-frame"
        src="lf-childcare-tile-map.html?embedded=1"
        scrolling="no"
        allowfullscreen>
      </iframe>
    </div>

  </div>

  <script>
    const toggle = document.getElementById("toggle");
    const frame  = document.getElementById("map-frame");
    const left   = document.getElementById("label-left");
    const right  = document.getElementById("label-right");

    const RACE_URL   = "lf-childcare-tile-map.html?embedded=1";
    const FAMILY_URL = "lf-ptype-childcare-tile-map.html?embedded=1";
    let frameResizeObserver = null;

    function resizeFrameToContent() {
      try {
        const doc = frame.contentDocument;
        if (!doc) return;
        const chart = doc.querySelector("#map-tile-root");
        const source = doc.querySelector(".mtm-source");
        const tablePanel = doc.querySelector("#mtm-right");
        const contentBottom = [chart, tablePanel, source].reduce((max, el) => {
          const rect = el?.getBoundingClientRect();
          return Math.max(max, rect?.bottom || 0);
        }, 0);
        const height = chart
          ? Math.ceil(contentBottom + 12)
          : Math.ceil(doc.body?.scrollHeight || 0);
        if (height) frame.style.height = `${Math.max(height, 900)}px`;
      } catch (err) {
        // Keep the CSS fallback height if iframe content is not directly readable.
      }
    }

    function watchFrameContent() {
      if (frameResizeObserver) {
        frameResizeObserver.disconnect();
        frameResizeObserver = null;
      }

      resizeFrameToContent();
      window.setTimeout(resizeFrameToContent, 250);
      window.setTimeout(resizeFrameToContent, 750);

      try {
        const doc = frame.contentDocument;
        if (!doc || !window.ResizeObserver) return;
        const chart = doc.querySelector("#map-tile-root");
        const tablePanel = doc.querySelector("#mtm-right");
        const source = doc.querySelector(".mtm-source");
        frameResizeObserver = new ResizeObserver(resizeFrameToContent);
        if (chart) frameResizeObserver.observe(chart);
        if (tablePanel) frameResizeObserver.observe(tablePanel);
        if (source) frameResizeObserver.observe(source);
        else if (doc.body) frameResizeObserver.observe(doc.body);
      } catch (err) {
        // Keep the CSS fallback height if iframe content is not directly readable.
      }
    }

    frame.addEventListener("load", watchFrameContent);
    window.addEventListener("resize", resizeFrameToContent);
    toggle.addEventListener("change", () => {
      if (toggle.checked) {
        frame.src = FAMILY_URL;
        left.classList.remove("active");
        right.classList.add("active");
      } else {
        frame.src = RACE_URL;
        left.classList.add("active");
        right.classList.remove("active");
      }
    });
  </script>
</body>
</html>
